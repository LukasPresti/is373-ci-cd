name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Automated Validation & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  build-and-push:
    name: Build & Publish Container Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env-select.outputs.target_env }}
      image_tag: ${{ steps.env-select.outputs.image_tag }}
      short_sha: ${{ steps.env-select.outputs.short_sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Target Environment & Tags
        id: env-select
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          
          if [ "${{ github.ref_name }}" = "qa" ]; then
            echo "target_env=qa" >> "$GITHUB_OUTPUT"
            echo "image_tag=qa" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner for Docker Tag
        id: repo-owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/is373-website:${{ steps.env-select.outputs.image_tag }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/is373-website:sha-${{ steps.env-select.outputs.short_sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Files
        uses: actions/checkout@v4

      - name: Downcase Repository Owner for Docker Tag
        id: repo-owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy.sh"
          target: "/opt/is373-app"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            chmod +x /opt/is373-app/deploy.sh
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            /opt/is373-app/deploy.sh "${{ needs.build-and-push.outputs.target_env }}" "ghcr.io/${{ steps.repo-owner.outputs.owner }}/is373-website:${{ needs.build-and-push.outputs.image_tag }}" "${{ github.sha }}" "1.0.0"
